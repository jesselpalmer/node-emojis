name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x, 26.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: npm run build

    - name: Run linting
      run: npm run lint

    - name: Check for bypassed commits
      run: npm run lint:check-bypass

    - name: Run tests with coverage
      run: npm run cover:ci

    - name: Smoke-test the packed package (CJS, ESM, TypeScript)
      run: npm run test:package
