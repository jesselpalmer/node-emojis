version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # TypeScript 7 breaks the build config and ts-node, which runs the
      # tests. Take TypeScript majors as a deliberate, separate change.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Node type majors can expose APIs missing on Node 20; bump by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # commitlint 20+ needs Node 22.12+, but contributors may use Node 20.
      - dependency-name: "@commitlint/*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
